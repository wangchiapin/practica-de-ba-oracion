           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);

    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

/* 共用設定：和其他漢字遊戲同一把 localStorage 鑰匙 hanziGames.settings（格式見 README） */
const SETTINGS_KEY='hanziGames.settings';
const SET_OPTS={script:['trad','simp'],lang:['es','en','zh'],phon:['pinyin','zhuyin','both','off'],rate:['slow','normal','fast']};
const RATE_VALUE={slow:0.45,normal:0.65,fast:0.85};
const READ2PHON={py:'pinyin',zy:'zhuyin',both:'both',none:'off'};   /* 舊版 read → 共用 phon */
const PHON2READ={pinyin:'py',zhuyin:'zy',both:'both',off:'none'};
function readSettings(){
 const out={v:1,script:'trad',lang:'es',phon:'pinyin',rate:'normal'};
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');}catch(e){}
 if(saved&&typeof saved==='object'){
  Object.keys(SET_OPTS).forEach(k=>{if(SET_OPTS[k].includes(saved[k]))out[k]=saved[k];});
 }else{
  /* 第一次：從舊的 ba_cfg 搬過來（舊版：lang es/en、zh tc/sc、read py/zy/none、speed slow/normal） */
  try{
   const old=JSON.parse(localStorage.getItem('ba_cfg')||'null');
   if(old&&typeof old==='object'){
    if(old.lang==='es'||old.lang==='en')out.lang=old.lang;
    if(old.zh==='sc')out.script='simp';else if(old.zh==='tc')out.script='trad';
    if(READ2PHON[old.read])out.phon=READ2PHON[old.read];
    if(old.speed==='slow'||old.speed==='normal')out.rate=old.speed;
   }
  }catch(e){}
  writeSettings(out);
 }
 return out;
}
function writeSettings(o){
 try{
  let cur={};
  try{cur=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{};}catch(e){}
  if(typeof cur!=='object'||Array.isArray(cur))cur={};
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.assign(cur,{v:1,script:o.script,lang:o.lang,phon:o.phon,rate:o.rate})));
 }catch(e){}
}

 if(cfg.read==='both')return o+`<span class="rb2"><span class="rd">${esc(t.py)}</span><span class="rd">${esc(t.zy)}</span><span>${z}</span></span></span>`;   /* 拼音＋注音：兩行疊在漢字上方 */

let spId=0;
function getVoice(){try{return speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));}catch(e){return null;}}
function utter(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=rate;const v=getVoice();if(v)u.voice=v;speechSynthesis.speak(u);return u;}
function speak(text){try{if(!('speechSynthesis' in window))return;spId++;speechSynthesis.cancel();utter(text,rateNow());}catch(e){}}
/* 逐詞聽：詞與詞之間的停頓、單詞最長等待時間，隨語速調整（慢 0.45 / 中 0.65 / 快 0.85） */
const wordGap=()=>Math.round(420*0.65/rateNow());
const wordMax=()=>Math.round(3200*0.55/rateNow());
function speechWords(tok){const w=[];tok.forEach(t=>{if(t.tc==='了'&&w.length)w[w.length-1]+='了';else w.push(t.tc);});return w;}
function speakWords(words){try{if(!('speechSynthesis' in window))return;const id=++spId;speechSynthesis.cancel();let i=0;const next=()=>{if(id!==spId||i>=words.length)return;const u=utter(words[i++],rateNow());let done=false;const go=()=>{if(done)return;done=true;setTimeout(next,wordGap());};u.onend=go;u.onerror=go;setTimeout(go,wordMax());};next();}catch(e){}}
function playL(mode){const c=ST.cur,q=ST.qs[ST.qi];if(!c.played){c.played=true;c.t0=Date.now();}if(mode==='w')speakWords(speechWords(q.s.tok));else speak(tcText(q.s.tok));}
function speakWord(tc){speak(tc==='了'?'好了':tc);}

/* ---------- 流程 ---------- */
function go(s){ST.screen=s;render();window.scrollTo(0,0);}
function setShared(p){Object.assign(S,p);writeSettings(S);syncCfg();render();}
function setCfg(k,v){
 if(k==='lang')return setShared({lang:v});
 if(k==='zh')return setShared({script:v==='sc'?'simp':'trad'});
 if(k==='read')return setShared({phon:READ2PHON[v]});
 if(k==='speed')return setShared({rate:v});
 cfg[k]=v;saveCfg();render();
}
/* 別的分頁／別的遊戲改了共用設定 → 這裡跟著變 */
window.addEventListener('storage',e=>{
 if(e.key!==null&&e.key!==SETTINGS_KEY)return;
 S=readSettings();syncCfg();render();
});
function startGame(){const v=($('nm')?$('nm').value:'').trim();cfg.name=v||T().defName;saveCfg();track('ba_start',{lang:cfg.lang,zh:cfg.zh});go('levels');}
function openLevel(n){if(!isUnlocked(n))return;ST.lv=n;go('intro');}
function variants(s){const t=s.tok;return BADPOOL[s.id].map(ix=>ix.map(i=>t[i]));}
function beginLevel(){
 const pool=shuffle(DATA.filter(d=>d.lv===ST.lv));
 const types=shuffle(['A','A','A','A','A','L','L','L','P','P']);
 ST.qs=pool.map((s,i)=>({s,type:types[i]}));
 ST.qi=0;ST.score=0;ST.streak=0;ST.firstOK=0;ST.results=[];newCur();track('ba_level_start',{lv:ST.lv});go('game');
}
function newCur(){
 const q=ST.qs[ST.qi],s=q.s;
 ST.look=null;ST.vocab=false;const c={tries:0,hint:false,done:false,ok:null,pts:0,elapsed:0,t0:Date.now(),msg:'',locked:[],picked:-1};
 if(q.type==='A'){let tray=shuffle(s.tok.map((t,i)=>Object.assign({i},t)));let n=0;while(tray.every((t,i)=>t.i===i)&&n++<10)tray=shuffle(tray);c.tray=tray;c.placed=[];}
 else if(q.type==='L'){const others=shuffle(DATA.filter(d=>d.lv===s.lv&&d.id!==s.id)).slice(0,2);c.opts=shuffle([s,...others]).map(d=>({id:d.id,ok:d.id===s.id}));c.played=false;setTimeout(()=>{if(ST.screen==='game'&&ST.cur===c)playL('w');},350);}
 else{const seen=new Set([tcText(s.tok)]);const wrong=[];for(const v of shuffle(variants(s))){const k=tcText(v);if(!seen.has(k)&&wrong.length<2){seen.add(k);wrong.push(v);}}c.opts=shuffle([{seq:s.tok,ok:true},...wrong.map(w=>({seq:w,ok:false}))]);}
 ST.cur=c;
}
function useHint(){const c=ST.cur;if(c.done||c.hint)return;c.hint=true;render();}
function placeTok(i){const c=ST.cur;if(c.done)return;const k=c.tray.findIndex(t=>t.i===i);if(k<0)return;c.placed.push(c.tray.splice(k,1)[0]);c.msg='';render();}
function unplaceTok(i){const c=ST.cur;if(c.done)return;const k=c.placed.findIndex(t=>t.i===i);if(k<0)return;c.tray.push(c.placed.splice(k,1)[0]);c.msg='';render();}
function clearTok(){const c=ST.cur;if(c.done)return;c.tray=c.tray.concat(c.placed);c.placed=[];c.msg='';render();}
function confirmA(){
 const c=ST.cur,q=ST.qs[ST.qi];if(c.done||c.placed.length!==q.s.tok.length)return;
 if(c.tries===0)c.elapsed=(Date.now()-c.t0)/1000;c.tries++;
 const ok=c.placed.every((t,i)=>t.tc===q.s.tok[i].tc);
 if(ok)return finishQ(true);
 if(c.tries>=2)return finishQ(false);
 let cut=c.placed.findIndex((t,i)=>t.tc!==q.s.tok[i].tc);c.tray=c.tray.concat(c.placed.splice(cut));c.msg='retry';render();shakeFx();
}
function pickOpt(k){
 const c=ST.cur;if(c.done||c.locked.includes(k))return;
 if(c.tries===0)c.elapsed=(Date.now()-c.t0)/1000;c.tries++;c.picked=k;
 if(c.opts[k].ok)return finishQ(true);
 if(c.tries>=2){return finishQ(false);}
 c.locked.push(k);c.msg='retry';render();shakeFx();
}
function shakeFx(){const el=document.querySelector('.fb.bad');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}
function mult(){return ST.streak>=3?1.5:ST.streak===2?1.2:1;}
function finishQ(ok){
 const c=ST.cur;c.done=true;c.ok=ok;let pts=0;
 if(ok){
  if(c.tries===1){ST.streak++;ST.firstOK++;pts=Math.round(100*mult())+Math.max(0,Math.round(50*(1-c.elapsed/10)));}
  else{ST.streak=0;pts=50;}
  pts=Math.max(0,pts-(c.hint?20:0));
 }else ST.streak=0;
 c.pts=pts;ST.score+=pts;
 ST.results.push({q:ST.qs[ST.qi],ok,tries:c.tries,hint:c.hint,pts});
 track('ba_answer',{lv:ST.lv,id:ST.qs[ST.qi].s.id,type:ST.qs[ST.qi].type,ok:ok,tries:c.tries});
 speak(curText());render();
}
function nextQ(){ST.qi++;if(ST.qi>=ST.qs.length)return finishLevel();newCur();go('game');}
function finishLevel(){
 const n=ST.firstOK,stars=n>=9?3:n>=7?2:n>=5?1:0;
 const before=prog[ST.lv]||0;prog[ST.lv]=Math.max(before,stars);saveProg();
 ST.final={score:ST.score,stars,firstOK:n,newUnlock:stars>=1&&ST.lv<3&&(prog[ST.lv+1]===undefined)&&before<1};
 lbSave(cfg.name,ST.lv,ST.score);track('ba_level_end',{lv:ST.lv,score:ST.score,stars});
 go('result');
}
function restartLevel(){beginLevel();}
function setRead(v){setCfg('read',v);}
function setSpeed(v){setCfg('speed',v);}
function showLook(tc){ST.look=TOKMAP[tc]||null;ST.vocab=false;render();}
function closeLook(){ST.look=null;ST.vocab=false;render();}
function openVocab(){
 const q=ST.qs[ST.qi],seen=new Set(),u=[];q.s.tok.forEach(t=>{if(!seen.has(t.tc)){seen.add(t.tc);u.push(t);}});
 let o=shuffle(u),n=0;while(u.length>1&&o.every((t,i)=>t===u[i])&&n++<10)o=shuffle(u);
 ST.vocabList=o;ST.vocab=true;ST.look=null;render();
}
function vocabHTML(){
 const t=T();
 const rows=ST.vocabList.map(k=>{const g=gloss(k.tc);const main=cfg.lang==='es'?g[0]:g[1],other=cfg.lang==='es'?g[1]:g[0];
  return `<div class="vrow"><div class="vz">${esc(zhOf(k))}</div><div class="vm"><div class="vp">${esc(readLine(k))}</div>${isZH()?'':`<div>${esc(main)}</div><div class="vp">${esc(other)}</div>`}</div><button class="vsp" onclick="speakWord('${k.tc}')" aria-label="${t.play}">▶</button></div>`;}).join('');
 return `<div class="sheet" onclick="closeLook()"><div class="sheetcard" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${t.vocab}</h2><button class="btn ghost" onclick="closeLook()">${t.close}</button></div><div class="vlist">${rows}</div></div></div>`;
}
function sheetHTML(){
 if(ST.vocab)return vocabHTML();
 const k=ST.look;if(!k)return '';const t=T(),g=gloss(k.tc);
 const main=cfg.lang==='es'?g[0]:g[1],other=cfg.lang==='es'?g[1]:g[0];
 return `<div class="sheet" onclick="closeLook()"><div class="sheetcard" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between"><div style="font-size:30px">${esc(zhOf(k))}</div><button class="btn ghost" onclick="closeLook()">${t.close}</button></div><div class="tl" style="font-size:16px;margin:4px 0">${esc(readLine(k))}</div>${isZH()?'':`<div style="font-size:18px">${esc(main)}</div><div class="tl">${esc(other)}</div>`}<button class="btn" onclick="speakWord('${k.tc}')">${t.play}</button></div></div>`;
}
async function openLB(){ST.lbRows=null;go('lb');ST.lbRows=await lbLoad();if(ST.screen==='lb')render();}

/* ---------- 畫面 ---------- */
function pairHTML(id){return `<div class="pair"><figure>${SC[id][0]}<figcaption>${isZH()?'':'之前 · '}${T().before}</figcaption></figure><div class="ar">→</div><figure>${SC[id][1]}<figcaption>${isZH()?'':'之後 · '}${T().after}</figcaption></figure></div>`;}
function seg(k,v,label){return `<button class="seg ${cfg[k]===v?'on':''}" onclick="setCfg('${k}','${v}')">${label}</button>`;}
function renderStart(){
 const t=T();
 return `<div class="card center"><h1>把它放好</h1><div class="sub">${isZH()?'':'Ponlo en su lugar · '}${esc(t.sub)}</div></div>
 <div class="card"><div class="lab" style="margin-top:0">${t.name}</div><input id="nm" type="text" maxlength="16" placeholder="${esc(t.ph)}" value="${esc(cfg.name)}">
 <div class="lab">${t.ui}</div><div class="row">${seg('lang','es','中＋ES')}${seg('lang','en','中＋EN')}${seg('lang','zh','中')}</div>${cfg.lang==='es'?`<div class="lab">${t.region}</div><div class="row">${seg('region','la','Latinoamérica')}${seg('region','es','España')}</div>`:''}
 <div class="lab">${t.script}</div><div class="row">${seg('zh','tc','繁體')}${seg('zh','sc','简体')}</div>
 <div class="lab">${t.read}</div><div class="row">${seg('read','py',t.py)}${seg('read','zy',t.zy)}${seg('read','both',t.both)}${seg('read','none',t.off)}</div>
 <div class="lab">${t.speed}</div><div class="row">${seg('speed','slow',t.slow)}${seg('speed','normal',t.norm)}${seg('speed','fast',t.fast)}</div>
 <div style="margin-top:16px"><button class="btn primary block" onclick="startGame()">${t.start}</button></div></div>`;
}
function renderLevels(){
 const t=T();
 let h=`<div class="bar"><div>${esc(cfg.name)}</div><button class="btn ghost" onclick="go('start')">⚙</button></div><h2>${t.pick}</h2>`;
 LV.forEach((l,i)=>{const n=i+1,ok=isUnlocked(n),st=prog[n]||0;
  h+=`<button class="lvcard" ${ok?'':'disabled'} onclick="openLevel(${n})"><div class="row" style="justify-content:space-between"><div class="t">${n} · ${cfg.zh==='sc'?l.sc:l.tc}</div><div class="stars">${starsStr(st)}</div></div>${isZH()?'':`<div class="d">${l[cfg.lang]}</div>`}${ok?'':`<div class="d">${t.locked}</div>`}</button>`;});
 h+=`<button class="btn block" onclick="openLB()">${t.rank}</button>`;
 return h;
}
const sm=x=>isZH()?'':`<small>${x}</small>`;
function renderIntro(){
 const t=T(),l=LV[ST.lv-1],ex=DATA.find(d=>d.id===l.ex);
 return `<div class="bar"><button class="ic" onclick="go('levels')">←</button><div>${ST.lv} · ${cfg.zh==='sc'?l.sc:l.tc}</div><div></div></div>
 <div class="card"><h2>${t.formula}</h2><div class="formula"><div class="f">${cfg.zh==='sc'?'谁':'誰'}${sm(t.who)}</div><div>＋</div><div class="f ba">把</div><div>＋</div><div class="f">${cfg.zh==='sc'?'东西':'東西'}${sm(t.thing)}</div><div>＋</div><div class="f">${cfg.zh==='sc'?'动作＋结果':'動作＋結果'}${sm(t.act)}</div></div>
 <div class="lab">${t.example}</div><div class="sent">${seqHTML(ex.tok)}。</div>${transHTML(ex)}
 <button class="btn" onclick="speak('${tcText(ex.tok)}')">${t.play}</button></div>
 <button class="btn primary block" onclick="beginLevel()">${t.begin}</button>`;
}
function topbar(){const t=T();return `<div class="bar"><button class="ic" onclick="go('levels')" aria-label="menu">☰</button><div>${ST.lv} · ${ST.qi+1}/${ST.qs.length}</div><div>${t.score} <b>${ST.score}</b></div>${ST.streak>=2?`<div class="combo">${t.combo} ${ST.streak}</div>`:''}<button class="ic" onclick="restartLevel()" aria-label="restart">↻</button></div>`;}
function renderGame(){
 const t=T(),q=ST.qs[ST.qi],c=ST.cur,s=q.s,last=ST.qi===ST.qs.length-1;
 const tools=`<div class="tools"><div class="mseg">${['py','zy','both','none'].map(v=>`<button class="mini ${cfg.read===v?'on':''}" onclick="setRead('${v}')">${v==='py'?t.py:v==='zy'?t.zy:v==='both'?t.both:'—'}</button>`).join('')}</div><div class="mseg">${['slow','normal','fast'].map(v=>`<button class="mini ${cfg.speed===v?'on':''}" onclick="setSpeed('${v}')">${v==='slow'?t.slow:v==='normal'?t.norm:t.fast}</button>`).join('')}</div></div>`;
 let h=topbar()+`<div class="card">${tools}<div class="qlabel">${q.type==='A'?t.qA:q.type==='L'?t.qL:t.qP}</div>`;
 if(q.type==='L'){
  h+=`<div class="row" style="justify-content:center"><button class="btn" onclick="playL('w')">${t.playW}</button><button class="btn" onclick="playL('s')">${t.playS}</button></div><div class="opts3">`;
  c.opts.forEach((o,k)=>{const cls=c.done?(o.ok?'ok':(c.picked===k?'bad':'')):(c.locked.includes(k)?'bad':'');h+=`<button class="opt3 ${cls}" onclick="pickOpt(${k})">${SC[o.id][1]}</button>`;});
  h+=`</div>`;
 }else h+=pairHTML(s.id);
 if(q.type==='A'&&!c.done){
  h+=`<div class="slots">${c.placed.map(x=>`<button class="chip ${x.tc==='把'?'ba':''}" onclick="unplaceTok(${x.i})">${tokHTML(x)}</button>`).join('')}</div>`;
  h+=`<div class="tray">${c.tray.map(x=>`<button class="chip ${x.tc==='把'?'ba':''}" onclick="placeTok(${x.i})">${tokHTML(x)}</button>`).join('')}</div>`;
  h+=`<div class="row"><button class="btn primary" onclick="confirmA()" ${c.placed.length===s.tok.length?'':'disabled'}>${t.confirm}</button><button class="btn ghost" onclick="clearTok()">${t.clear}</button></div>`;
 }
 if(q.type==='P'){
  c.opts.forEach((o,k)=>{const cls=c.done?(o.ok?'ok':(c.picked===k?'bad':'')):(c.locked.includes(k)?'bad':'');h+=`<button class="optS ${cls}" onclick="pickOpt(${k})">${seqHTML(o.seq)}。</button>`;});
 }
 if(!c.done){
  if(c.msg==='retry')h+=`<div class="fb bad">${t.tryAgain}</div>`;
  if(c.hint){if(q.type==='L')h+=`<div class="sent">${seqHTML(s.tok)}。</div>`;h+=transHTML(s);}
  const hintOK=!isZH()||q.type==='L';   /* 純中文模式沒有翻譯可提示，只有聽音題的「顯示句子」提示保留 */
  const vOK=q.type!=='L'||c.hint;
  h+=`<div class="row" style="margin-top:8px">${c.hint||!hintOK?'':`<button class="btn ghost" onclick="useHint()">${t.hint}</button>`}${vOK?`<button class="btn ghost" onclick="openVocab()">${t.vocab}</button>`:''}</div>`;
 }else{
  h+=`<div class="fb ${c.ok?'ok':'bad'}"><b>${c.ok?t.correct:t.wrong}</b> · +${c.pts} ${t.pts}${c.ok&&c.tries===1&&ST.streak>=2?' · '+t.combo+' ×'+mult():''}</div>`;
  h+=`<div class="sent">${seqHTML(s.tok)}。</div>${transHTML(s)}`;
  h+=`<div class="row"><button class="btn" onclick="speak(curText())">${t.play}</button><button class="btn primary" style="flex:1" onclick="nextQ()">${last?t.finish:t.next}</button></div>`;
 }
 return h+`</div>`;
}
function renderResult(){
 const t=T(),f=ST.final;
 let h=`<div class="card center"><h2>${t.done}</h2><div class="stars big">${starsStr(f.stars)}</div><div class="sub">${t.yourScore}: <b style="color:var(--ink);font-size:22px">${f.score}</b></div><div class="sub">${t.firstTry}: ${f.firstOK}/${ST.qs.length}</div>`;
 if(f.stars>=1&&ST.lv<3&&isUnlocked(ST.lv+1))h+=`<div class="fb ok">${t.unlockedMsg}</div>`;
 if(f.stars<1&&ST.lv<3)h+=`<div class="note">${t.needStar}</div>`;
 h+=`</div>`;
 const rev=ST.results.filter(r=>!(r.ok&&r.tries===1));
 h+=`<div class="card"><h2>${t.review}</h2>`;
 if(!rev.length)h+=`<div class="sub">${t.perfect}</div>`;
 rev.forEach(r=>{h+=`<div class="rev">${pairHTML(r.q.s.id)}<div class="sent">${seqHTML(r.q.s.tok)}。</div>${transHTML(r.q.s)}</div>`;});
 h+=`</div><div class="row"><button class="btn" style="flex:1" onclick="beginLevel()">${t.replay}</button>`;
 if(ST.lv<3&&isUnlocked(ST.lv+1))h+=`<button class="btn primary" style="flex:1" onclick="openLevel(${ST.lv+1})">${t.nextLv}</button>`;
 h+=`</div><div class="row" style="margin-top:8px"><button class="btn" style="flex:1" onclick="go('levels')">${t.menu}</button><button class="btn" style="flex:1" onclick="openLB()">${t.rank}</button></div>`;
 return h;
}
function renderLB(){
 const t=T();
 let h=`<div class="bar"><button class="ic" onclick="go('levels')">←</button><div>${t.lb}</div><div></div></div><div class="card">`;
 if(ST.lbRows===null)h+=`<div class="sub">…</div>`;
 else{h+=`<table class="lbt"><tr><th>#</th><th>${t.player}</th><th>1</th><th>2</th><th>3</th><th>${t.total}</th></tr>`;
  ST.lbRows.forEach((r,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.l1||0}</td><td>${r.l2||0}</td><td>${r.l3||0}</td><td><b>${r.total||0}</b></td></tr>`;});
  h+=`</table>`;}
 if(!FB_OK)h+=`<div class="note">${t.localNote}</div>`;
 return h+`</div>`;
}
function render(){
 const m={start:renderStart,levels:renderLevels,intro:renderIntro,game:renderGame,result:renderResult,lb:renderLB};
 const el=$('app');if(!el)return;
 const nm=$('nm');if(nm&&ST.screen==='start')cfg.name=nm.value;
 el.className='';document.title=isZH()?'把它放好':'把它放好 · Ponlo en su lugar';
 el.innerHTML=m[ST.screen]()+sheetHTML();
}
document.addEventListener('click',e=>{const tk=e.target.closest&&e.target.closest('.tk');if(!tk)return;if(!tk.closest('.sent'))return;e.stopPropagation();e.preventDefault();showLook(tk.dataset.t);},true);
document.addEventListener('DOMContentLoaded',render);
if(document.readyState!=='loading')render();
</script>
</body>
</html>
